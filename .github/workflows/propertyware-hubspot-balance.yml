
name: Propertyware to HubSpot Portfolio Balance Sync

on:
  workflow_dispatch:

  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  sync-portfolio-balances:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Propertyware balance sync
        env:
          PW_CLIENT_ID: ${{ secrets.PW_CLIENT_ID }}
          PW_CLIENT_SECRET: ${{ secrets.PW_CLIENT_SECRET }}
          PW_SYSTEM_ID: ${{ secrets.PW_SYSTEM_ID }}

          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}

          PROPERTYWARE_STORAGE_STATE: ${{ secrets.PROPERTYWARE_STORAGE_STATE }}

          DRY_RUN: "true"

        run: |
          python propertyware_hubspot_balance_sync.py

      - name: Upload balance audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propertyware-balance-audit
          path: propertyware_balance_results.csv
          if-no-files-found: ignore
          retention-days: 14
